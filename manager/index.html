<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Izyan Tech Manager</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ITW Manager">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#071426;--bg2:#0b1d31;--card:#0e2239;--card2:#10263f;--line:rgba(196,215,239,.16);--gold:#d7a83d;--gold2:#f1d27a;--txt:#f3f6fb;--muted:#9fb0c5;--green:#25d366;--red:#ff7b7b;--amber:#ffb86b;--blue:#7cb8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
.hide{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#061323f2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{border:0;background:#10243a;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:#0c1f35;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok i{background:var(--green)}.chip.busy i{background:var(--gold2)}.chip.pending i{background:var(--amber)}.chip.err i{background:var(--red)}.chip.off i{background:#55657a}
main{max-width:860px;margin:auto;padding:14px}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#061323f7;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--gold2);background:#10243a}
.nav a.plus{color:#1a1a15}.nav a.plus span.pl{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));margin-top:-2px}
.nav a.plus svg{stroke:#1a1a15}.nav a.plus em{font-style:normal;color:var(--muted)}
/* cards */
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .cnt{font-size:11px;background:#1a2f48;color:var(--muted);padding:2px 8px;border-radius:99px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}.kpi b{display:block;font-size:22px;margin-top:2px;letter-spacing:-.5px}
.kpi.gold b{color:var(--gold2)}.kpi.red b{color:var(--red)}.kpi.green b{color:#7ee6ac}
.banner{border-radius:16px;padding:14px 16px;margin-bottom:12px;background:linear-gradient(135deg,rgba(37,211,102,.16),rgba(215,168,61,.12));border:1px solid rgba(37,211,102,.4);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}.row .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .main small{color:var(--muted);font-size:12.5px;display:block}
.row .amt{text-align:right;font-weight:800;white-space:nowrap}.row .amt small{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.list a.row{color:inherit;text-decoration:none}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.b-paid{background:rgba(37,211,102,.15);color:#7ee6ac}.b-partial{background:rgba(255,184,107,.15);color:var(--amber)}.b-overdue{background:rgba(255,123,123,.16);color:var(--red)}.b-due{background:rgba(241,210,122,.18);color:var(--gold2)}.b-upcoming{background:#1a2f48;color:var(--muted)}
.b-stage{background:#1a2f48;color:#cfe0f5}.b-live{background:rgba(37,211,102,.15);color:#7ee6ac}.b-cancel{background:rgba(255,123,123,.12);color:var(--red)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#10243a;color:var(--txt);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;min-height:42px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1a15;border:0}
.btn.green{background:var(--green);color:#062515;border:0}
.btn.red{background:rgba(255,123,123,.12);color:var(--red);border-color:rgba(255,123,123,.35)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.grid2{display:grid;grid-template-columns:1fr 1fr}
.wa svg{width:17px;height:17px;fill:currentColor}
/* forms */
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:5px}
input.i,select.i,textarea.i{width:100%;padding:12px;border-radius:12px;border:1px solid #2c4360;background:#071729;font-size:16px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--gold)}
textarea.i{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{position:relative;margin-bottom:12px}.search input{padding-left:38px}.search svg{position:absolute;left:12px;top:13px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex-shrink:0;border:1px solid var(--line);background:#0c1f35;color:var(--muted);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}.seg button.on{background:rgba(215,168,61,.16);border-color:rgba(215,168,61,.6);color:var(--gold2)}
/* packages */
.pk{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#0b1d31}
.pk.on{border-color:var(--gold);background:rgba(215,168,61,.08)}
.pk .main{flex:1}.pk .main b{display:block;font-size:14px}.pk .main small{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#10243a;font-size:18px;cursor:pointer}.qty input{width:84px;text-align:right;padding:7px 8px;border-radius:10px;border:1px solid #2c4360;background:#071729;font-size:15px}
.sum{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}.sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.sum .tot{font-size:18px;font-weight:800;color:var(--gold2)}
.green-t{color:#7ee6ac}.red-t{color:var(--red)}.muted{color:var(--muted)}
table.sch{width:100%;border-collapse:collapse;font-size:13.5px}table.sch th{text-align:left;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}table.sch td{padding:8px 4px;border-bottom:1px solid var(--line)}table.sch td.r,table.sch th.r{text-align:right}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:4px 0 12px}.steps::-webkit-scrollbar{display:none}
.steps button{flex-shrink:0;border:1px solid var(--line);background:#0c1f35;color:var(--muted);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
.steps button.done{color:#7ee6ac;border-color:rgba(37,211,102,.35)}.steps button.cur{background:rgba(215,168,61,.18);color:var(--gold2);border-color:var(--gold)}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}.chk:first-of-type{border-top:0}.chk input{width:20px;height:20px;accent-color:var(--green)}
.pbar{height:8px;border-radius:9px;background:#1a2f48;overflow:hidden;margin:8px 0 4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--green))}
.hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}.hd .main{flex:1;min-width:0}.hd h3{margin:0 0 2px;font-size:19px}.hd small{color:var(--muted)}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#1d3a5c,#12304d);color:var(--gold2);flex-shrink:0}
.dua{position:relative;border-radius:18px;padding:16px 16px 14px;margin-bottom:12px;background:radial-gradient(circle at 100% 0,rgba(215,168,61,.18),transparent 55%),linear-gradient(160deg,#122a46,#0b1d31);border:1px solid rgba(241,210,122,.4)}
.dua .dh{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--gold2);text-transform:uppercase;margin-bottom:10px}
.dua .ar{direction:rtl;text-align:right;font-family:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic","Geeza Pro",serif;font-size:23px;line-height:1.95;color:#fff;margin:0 0 8px}
.dua .tr{font-style:italic;color:#d9e3ef;font-size:13.5px;margin:0 0 6px}.dua .en{font-size:14px;color:#f3f6fb;margin:0 0 6px}.dua .src{font-size:11.5px;color:var(--muted);margin:0}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:18px;margin:8px 0 2px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative;min-width:0}
.bars .b .v{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:800;color:#dfe8f3}
.bars .b i{display:block;border-radius:4px 4px 0 0}.bars .b i+i{border-radius:0}
.bars .b.cur .m{color:var(--gold2)}
.bars .m{font-size:9.5px;color:var(--muted);text-align:center;margin-top:4px;white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.c-shop{background:var(--gold2)}.c-bill{background:var(--green)}.c-oth{background:var(--blue)}.c-col{background:linear-gradient(180deg,#7ee6ac,#1f9e5a)}
.rtable{width:100%;border-collapse:collapse;font-size:12.5px}.rtable th{color:var(--muted);font-size:11px;text-align:right;padding:7px 4px;border-bottom:1px solid var(--line);font-weight:700}.rtable th:first-child,.rtable td:first-child{text-align:left}
.rtable td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}.rtable tr.tot td{font-weight:800;color:var(--gold2);border-bottom:0}.rtable tr.cur td:first-child{color:var(--gold2);font-weight:800}
.scrollx{overflow-x:auto;margin:0 -4px;padding:0 4px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(640px,100%);max-height:92vh;overflow:auto;background:#0a1a2d;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:#1a2f48;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e9f7ef;color:#062515;font-weight:700;padding:11px 16px;border-radius:12px;z-index:90;box-shadow:0 12px 30px #0008;max-width:90vw;text-align:center;font-size:14px}
/* lock */
.lock{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 20%,#173454,#071426 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.lock .logo{width:72px;height:72px;border-radius:20px;margin-bottom:14px}
.lock h2{margin:0 0 4px}.lock p{color:var(--muted);margin:0 0 18px;font-size:14px}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 18px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold2)}.dots i.f{background:var(--gold2)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}.pad button{height:62px;border-radius:18px;border:1px solid var(--line);background:#0e2239;font-size:24px;font-weight:700;cursor:pointer}
.lock .err{color:var(--red);min-height:20px;font-size:13.5px;margin-bottom:6px}
.lock form{width:min(360px,100%);text-align:left}
.tiny{font-size:12px;color:var(--muted)}
hr.s{border:0;border-top:1px solid var(--line);margin:14px 0}
code.k{background:#0c1f35;border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:12.5px}
ol.guide{padding-left:20px;margin:6px 0}ol.guide li{margin:6px 0;font-size:13.5px;color:#d5e0ee}
</style>
</head>
<body>
<div id="lock" class="lock hide"></div>

<header class="top">
 <button class="back hide" id="backBtn" aria-label="Back">‹</button>
 <h1 id="title">Izyan Tech Manager</h1>
 <button class="chip off" id="syncChip" type="button"><i></i><span>Local</span></button>
</header>
<main id="view"></main>

<nav class="nav" aria-label="Main">
 <a href="#home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</a>
 <a href="#orders" data-nav="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg>Orders</a>
 <a href="#new" data-nav="new" class="plus"><span class="pl"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><em>New</em></a>
 <a href="#clients" data-nav="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-3-5.5"/></svg>Clients</a>
 <a href="#more" data-nav="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</a>
</nav>
<div id="toast" class="hide"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hide">

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/dejavu.js"></script>
<script src="vendor/dejavu-Bold.js"></script>
<script>
'use strict';
/* =====================================================================
   Izyan Tech Manager — clients, orders, 0% EMI, payments, invoices,
   WhatsApp reminders. Data on this device (IndexedDB) + Google Sheet sync.
   ===================================================================== */
const TABLES = ['Clients', 'Orders', 'Payments', 'Invoices', 'Settings'];
const STAGES = ['Enquiry', 'Confirmed', 'Content received', 'In progress', 'Review', 'Live', 'Cancelled'];
const ACTIVE_STAGES = ['Confirmed', 'Content received', 'In progress', 'Review'];
const METHODS = ['UPI', 'Cash', 'Bank transfer', 'Other'];
const MAX_EMI = 14;

const DEFAULT_SETTINGS = {
  business: 'IZYAN TECH WORLD',
  tagline: 'Digital shops • Billing apps • Websites • Reels • Automation',
  phone: '919136680597',
  email: '',
  address: '',
  upiId: '',
  upiName: 'IZYAN TECH WORLD',
  prefix: 'ITW',
  comboDiscount: 1000,
  emiRound: 10,
  supportFee: 1500,
  deliveryDays: 7,
  catalog: [
    { code: 'DS_STD', group: 'shop', name: 'QR Digital Shop — Standard', price: 5699, unit: '' },
    { code: 'DS_UPI', group: 'shop', name: 'QR Digital Shop + UPI QR Checkout', price: 6699, unit: '' },
    { code: 'BL_STARTER', group: 'billing', name: 'Billing App — Starter', price: 5500, unit: '' },
    { code: 'BL_PRO', group: 'billing', name: 'Billing App — Pro', price: 7500, unit: '' },
    { code: 'BL_MULTI', group: 'billing', name: 'Billing App — Multi-Staff', price: 9500, unit: '' },
    { code: 'PHOTOS', group: 'addon', name: 'Extra product photos (per 10)', price: 500, unit: 'set of 10' },
    { code: 'SUPPORT', group: 'support', name: 'Yearly support renewal', price: 1500, unit: 'year' },
    { code: 'WEBSITE', group: 'custom', name: 'Website / Landing page', price: 0, unit: '' },
    { code: 'REELS', group: 'custom', name: 'Reels & digital marketing', price: 0, unit: '' },
    { code: 'EXCEL', group: 'custom', name: 'Excel automation / Dashboard', price: 0, unit: '' },
    { code: 'TOOL', group: 'custom', name: 'Custom tool / WhatsApp automation', price: 0, unit: '' }
  ],
  templates: {
    reminder: 'Hi {name} 👋\n\nYour {inst} of *₹{amount}* for *{service}* {dueText}.\nOrder: {orderNo}\nBalance after this payment: ₹{balanceAfter}\n\nUPI: {upi}\n\nPlease share the payment screenshot once done. Thank you! 🙏\n— {business}',
    receipt: 'Hi {name} ✅\n\nWe have received your payment of ₹{amount} ({method}, {date}). Thank you!\nOrder: {orderNo}\nBalance: ₹{balance}\n{nextLine}\n— {business}',
    invoice: 'Hi {name},\n\nPlease find your invoice *{invoiceNo}* attached.\nTotal: ₹{total}\nPaid: ₹{paid}\nBalance: ₹{balance}\n{nextLine}\nUPI: {upi}\n\n— {business}',
    quote: 'Hi {name} 👋\n\nHere is your quotation ({orderNo}):\n{items}\n{discountLine}*Total: ₹{total}*\n\n{planText}\n\nExpected delivery: {deliveryDate}\n0% interest — no extra charge on EMI.\nReply to confirm your order.\n— {business}',
    support: 'Hi {name} 👋\n\nYour support for *{service}* ends on {supportDate}.\nRenewing support for the next 1 year costs ₹{fee} — includes fixes, small changes and WhatsApp help.\n\nReply to renew.\n— {business}',
    hello: 'Hi {name} 👋\n\n— {business}'
  }
};

/* ------------------------------------------------------------ utilities */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R = n => Math.round((Number(n) || 0) * 100) / 100;
const P = n => Number(n) || 0;
const inr = n => { const v = R(n); return v.toLocaleString('en-IN', { maximumFractionDigits: 2 }); };
const rs = n => '₹' + inr(n);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const isoDay = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => isoDay(new Date());
const nowISO = () => new Date().toISOString();
const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDay = s => { if (!s) return ''; const d = parseDay(s); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtShort = s => { if (!s) return ''; const d = parseDay(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const addMonths = (s, n) => { const d = parseDay(s); return isoDay(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const firstOfNextMonth = s => addMonths(s, 1);
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return isoDay(d); };

/* ------------------------------------------------------------ IndexedDB */
const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('itw-manager', 1);
      rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains('rec')) db.createObjectStore('rec'); if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta'); };
      rq.onsuccess = () => { this.db = rq.result; res(); };
      rq.onerror = () => rej(rq.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(store, k, v) { return this.tx(store, 'readwrite', s => { s.put(v, k); }); },
  putMany(store, pairs) { return pairs.length ? this.tx(store, 'readwrite', s => { pairs.forEach(([k, v]) => s.put(v, k)); }) : Promise.resolve(); },
  getAll(store) {
    return new Promise((res, rej) => {
      const out = []; const t = this.db.transaction(store, 'readonly'); const c = t.objectStore(store).openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } else res(out); };
      c.onerror = () => rej(c.error);
    });
  },
  clear(store) { return this.tx(store, 'readwrite', s => { s.clear(); }); }
};

function stamp(r, isNew) {

  r.updatedAt = nowISO(); r.updatedBy = (S.me && S.me.name) || 'me'; r.rev = (Number(r.rev) || 0) + 1;
  return r;
}
async function save(list) {               // [[table, record, isNew], ...]

  await putRecs(pairs); await saveOutbox();

}

const catalogItem = code => settings().catalog.find(c => c.code === code);

function orderTotals(o) {
  const st = settings();
  const items = o.items || [];
  const subtotal = R(items.reduce((s, it) => s + P(it.price) * P(it.qty || 1), 0));
  const hasShop = items.some(it => it.group === 'shop' && P(it.qty) > 0);
  const hasBilling = items.some(it => it.group === 'billing' && P(it.qty) > 0);
  const combo = o.noCombo ? 0 : (hasShop && hasBilling ? P(st.comboDiscount) : 0);
  const extra = Math.max(0, P(o.extraDiscount));
  const total = Math.max(0, R(subtotal - combo - extra));
  return { subtotal, combo, extra, total };
}

/* EMI schedule — 0% interest. Advance due on the order date, instalments on the 1st of each month.
   Instalments are rounded down to emiRound; the last one absorbs the difference. */
function buildSchedule(o) {
  const { total } = orderTotals(o);
  const plan = o.plan || { mode: 'full' };
  const date = o.date || today();
  if (plan.mode !== 'emi') return [{ n: 0, label: 'Full payment', due: date, amount: total }];
  const down = Math.min(Math.max(0, R(plan.down)), total);
  const months = Math.min(MAX_EMI, Math.max(1, Math.round(P(plan.months) || 1)));
  const start = plan.start || firstOfNextMonth(date);
  const rest = R(total - down);
  const rows = [];
  if (down > 0) rows.push({ n: 0, label: 'Advance', due: date, amount: down });
  if (rest > 0) {
    const step = Math.max(1, P(settings().emiRound) || 1);
    let base = Math.floor(rest / months / step) * step;
    if (base <= 0) base = Math.floor(rest / months);
    for (let i = 1; i <= months; i++) {
      const amount = i < months ? base : R(rest - base * (months - 1));
      rows.push({ n: i, label: 'EMI ' + i + '/' + months, due: addMonths(start, i - 1), amount });
    }
  }
  return rows;
}

const orderPayments = o => live('Payments').filter(p => p.orderId === o.id).sort((a, b) => (a.date + a.createdAt).localeCompare(b.date + b.createdAt));
const paidFor = o => R(orderPayments(o).reduce((s, p) => s + P(p.amount), 0));

/* allocates payments to the schedule, oldest due first */
function orderState(o) {
  const t = orderTotals(o);
  const paid = paidFor(o);
  const td = today();
  let left = paid;
  const rows = buildSchedule(o).map(r => {
    const got = R(Math.min(left, r.amount)); left = R(left - got);
    let status;
    if (got >= r.amount - 0.001) status = 'paid';
    else if (r.due < td) status = 'overdue';
    else if (r.due === td) status = 'due';
    else if (got > 0) status = 'partial';
    else status = 'upcoming';
    return Object.assign({}, r, { paid: got, pending: R(r.amount - got), status });
  });
  const balance = R(Math.max(0, t.total - paid));
  const next = rows.find(r => r.status !== 'paid') || null;
  const cancelled = o.stage === 'Cancelled';
  return Object.assign({}, t, { paid, balance, rows, next, cancelled, extraPaid: R(Math.max(0, paid - t.total)) });
}

function nextNumber(kind) {
  const st = settings(), yr = new Date().getFullYear();
  if (kind === 'order') {
    const max = live('Orders').reduce((m, o) => Math.max(m, Number(String(o.orderNo || '').split('-').pop()) || 0), 0);
    return st.prefix + '-' + String(max + 1).padStart(4, '0');
  }
  const tag = kind === 'receipt' ? st.prefix + '-R-' + yr + '-' : st.prefix + '-' + yr + '-';
  const max = live('Invoices').filter(i => String(i.invoiceNo || '').startsWith(tag))
    .reduce((m, i) => Math.max(m, Number(String(i.invoiceNo).slice(tag.length)) || 0), 0);
  return tag + String(max + 1).padStart(4, '0');
}

const CHECKLISTS = {
  shop: ['Logo received', 'Product list & prices', 'Product photos', 'WhatsApp number for orders', 'UPI ID (for UPI plan)', 'Shop live link shared', 'QR code delivered'],
  billing: ['Product list & prices', 'Staff names & phones', 'Opening stock', 'Google Sheet set up', 'App installed on phones', 'Training done'],
  generic: ['Requirements confirmed', 'Content received', 'First draft shared', 'Changes done', 'Delivered']
};
function checklistFor(o) {
  const groups = new Set((o.items || []).filter(i => P(i.qty) > 0).map(i => i.group));
  const list = [];
  const upiPlan = (o.items || []).some(i => i.code === 'DS_UPI' && P(i.qty) > 0);
  if (groups.has('shop')) CHECKLISTS.shop.forEach(x => { if (x.startsWith('UPI ID') && !upiPlan) return; list.push('Shop: ' + x.replace(' (for UPI plan)', '')); });
  if (groups.has('billing')) CHECKLISTS.billing.forEach(x => list.push('Billing: ' + x));
  if (groups.has('custom') || (!groups.has('shop') && !groups.has('billing'))) CHECKLISTS.generic.forEach(x => list.push(x));
  return list;
}
const hasSupportable = o => (o.items || []).some(i => (i.group === 'shop' || i.group === 'billing') && P(i.qty) > 0);

/* dues across all orders */
function allDues() {
  const out = [];
  live('Orders').forEach(o => {
    if (o.stage === 'Cancelled' || o.stage === 'Enquiry') return;
    const st = orderState(o);
    st.rows.forEach(r => { if (r.status !== 'paid') out.push({ o, st, r }); });
  });
  return out.sort((a, b) => a.r.due.localeCompare(b.r.due));
}

/* ------------------------------------------------------------ delivery & monthly stats */
// A project = one delivered product type in an order: a combo (Digital Shop + Billing) counts as 2 projects.
function deliverables(o) {
  const g = new Set((o.items || []).filter(i => P(i.qty) > 0).map(i => i.group));
  const shop = g.has('shop') ? 1 : 0, billing = g.has('billing') ? 1 : 0, other = g.has('custom') ? 1 : 0;
  return { shop, billing, other, total: shop + billing + other };
}
const isDelivered = o => o.stage === 'Live' && !!o.liveDate;
const ymOf = s => String(s || '').slice(0, 7);
const addYM = (ym, n) => addMonths(ym + '-01', n).slice(0, 7);
const fmtYM = ym => { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1] + ' ' + y; };
function monthStats(ym) {
  const out = { ym, orders: 0, value: 0, shop: 0, billing: 0, other: 0, delivered: 0, collected: 0 };
  live('Orders').forEach(o => {
    if (o.stage !== 'Enquiry' && o.stage !== 'Cancelled' && ymOf(o.date) === ym) { out.orders++; out.value = R(out.value + orderTotals(o).total); }
    if (isDelivered(o) && ymOf(o.liveDate) === ym) { const d = deliverables(o); out.shop += d.shop; out.billing += d.billing; out.other += d.other; out.delivered += d.total; }
  });
  live('Payments').forEach(p => { if (ymOf(p.date) === ym) out.collected = R(out.collected + P(p.amount)); });
  return out;
}
const lastMonths = (endYM, n = 12) => Array.from({ length: n }, (_, i) => addYM(endYM, i - n + 1));
function deliveryBars(stats, curYM) {
  const max = Math.max(1, ...stats.map(s => s.delivered));
  return '<div class="bars">' + stats.map(s => {

function deadlineInfo(o) {
  if (!o.deadline) return null;
  if (o.stage === 'Live' && o.liveDate) {
    const late = daysBetween(o.deadline, o.liveDate);
    return { cls: late > 0 ? 'b-overdue' : 'b-paid', short: late > 0 ? 'Delivered ' + late + 'd late' : 'On time', long: late > 0 ? 'Delivered ' + late + ' day' + (late > 1 ? 's' : '') + ' late' : 'Delivered on time ✓' };
  }
  if (o.stage === 'Cancelled') return null;
  const left = daysBetween(today(), o.deadline);
  if (left < 0) return { cls: 'b-overdue', short: 'Late ' + (-left) + 'd', long: 'Late by ' + (-left) + ' day' + (left < -1 ? 's' : ''), late: true, left };
  if (left === 0) return { cls: 'b-due', short: 'Due today', long: 'Delivery due today', left };
  return { cls: left <= 2 ? 'b-partial' : 'b-upcoming', short: 'Delivery in ' + left + 'd', long: left + ' day' + (left > 1 ? 's' : '') + ' left', left };
}

async function api(action, payload, url, key) {

    return j;
  } catch (e) {

    if (e instanceof TypeError) throw new Error(navigator.onLine ? 'Could not reach the Sheet — the URL must end with /exec and access must be "Anyone"' : 'No internet connection');

}

    const writes = [];
    for (const t of Object.keys(j.rows || {})) {
      if (!S.t[t]) continue;
      for (const r of j.rows[t]) {
        if (S.outbox.has(t + '|' + r.id)) continue;
        const cur = S.t[t].get(r.id);
        if (!cur || isNewer(r, cur)) { S.t[t].set(r.id, r); writes.push([t, r]); changed = true; }
      }
    }
    await putRecs(writes);
    S.cursor = Number(j.cursor) || S.cursor; await saveMeta('cursor', S.cursor);
    S.lastSync = Date.now(); await saveMeta('lastSync', S.lastSync);
    S.sync = { state: S.outbox.size ? 'pending' : 'ok', msg: '' };
  } catch (e) {
    S.sync = { state: 'err', msg: e.message };
  } finally {
    syncing = false; updateChip();
    if (changed && S.unlocked) render();
    if (syncAgain) { syncAgain = false; scheduleSync(300); }
  }
}

async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin + ':itw-manager');
  const h = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function showLock() {
  S.unlocked = false;

    '<div class="pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, '⌫'].map(k => '<button type="button" data-k="' + k + '">' + k + '</button>').join('') + '</div>';
  const len = S.me.pinLen || 4;

  draw();

    draw();

async function setStage(o, stage) {

  if (stage === 'Live' && !r.liveDate) { r.liveDate = today(); if (hasSupportable(r)) r.supportUntil = addYear(r.liveDate); }
  await saveOne('Orders', r);
  toast('Stage: ' + stage + (stage === 'Live' && r.supportUntil ? ' • support till ' + fmtDay(r.supportUntil) : ''));

}

}

$('#importFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  let data; try { data = JSON.parse(await file.text()); } catch (err) { toast('This backup file is not valid'); return; }
  if (!data || data.app !== 'izyan-tech-manager' || !data.tables) { toast('This is not an Izyan Tech Manager backup file'); return; }
  if (!(await confirmBox('Restore this backup? Only records that are newer in the backup are applied; everything else stays as it is.', 'Restore'))) return;
  const writes = []; let n = 0;
  TABLES.forEach(t => (data.tables[t] || []).forEach(r => { if (!r || !r.id) return; const cur = S.t[t].get(r.id); if (!cur || isNewer(r, cur)) { S.t[t].set(r.id, r); writes.push([t, r]); S.outbox.add(t + '|' + r.id); n++; } }));
  await putRecs(writes); await saveOutbox(); scheduleSync(); toast(n + ' records restored'); render();
};

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || !S.unlocked) return;
  e.preventDefault(); e.stopPropagation();
  const id = b.dataset.id, act = b.dataset.act;
  if (act === 'pay') return payForm(id, P(b.dataset.amt));
  if (act === 'editPay') { const p = get('Payments', id); if (p) payForm(p.orderId, 0, p); return; }
  if (act === 'receipt') { const p = get('Payments', id); if (p) { b.disabled = true; try { await sendReceipt(p); } finally { b.disabled = false; } } return; }
  if (act === 'invoice') { const o = get('Orders', id); if (o) { b.disabled = true; try { await sendInvoice(o); } finally { b.disabled = false; } } return; }
  if (act === 'waHello') { const c = get('Clients', id); if (c) openWA(c.phone, fill(settings().templates.hello, { name: c.name, business: settings().business })); return; }
  if (act === 'waQuote') { const o = get('Orders', id); if (o) openWA(clientOf(o).phone, msgQuote(o)); return; }
  if (act === 'waSupport') { const o = get('Orders', id); if (o) openWA(clientOf(o).phone, msgSupport(o)); return; }
  if (act === 'waRemind') {
    const o = get('Orders', id); if (!o) return;
    const r = orderState(o).rows.find(x => String(x.n) === String(b.dataset.n)); if (!r) return;
    openWA(clientOf(o).phone, msgReminder(o, r));
    const rec = get('Orders', id); rec.reminders = Object.assign({}, rec.reminders || {}, { [r.n]: today() }); await saveOne('Orders', rec); render();
    return;
  }
  if (act === 'renew') {
    const o = get('Orders', id), st = settings(), sup = st.catalog.find(c => c.code === 'SUPPORT') || { code: 'SUPPORT', group: 'support', name: 'Yearly support renewal' };
    draft = { id: uid(), orderNo: '', clientId: o.clientId, date: today(), stage: 'Confirmed', items: [{ code: sup.code, group: 'support', name: sup.name + ' — ' + orderService(o), price: P(st.supportFee), qty: 1 }], plan: { mode: 'full', down: 0, months: 6, start: firstOfNextMonth(today()) }, extraDiscount: 0, notes: 'Renewal for ' + o.orderNo, renewalOf: o.id, _for: 'new' };
    const rec = get('Orders', id); rec.supportRenewed = true; await saveOne('Orders', rec);
    location.hash = '#new'; return;
  }
  if (act === 'delOrder') {
    const o = get('Orders', id); if (!o) return;
    if (orderPayments(o).length) { toast('This order has payments — delete them first'); return; }
    if (await confirmBox('Delete order ' + o.orderNo + ' permanently?', 'Delete', true)) { await remove('Orders', o); live('Invoices').filter(i => i.orderId === o.id).forEach(i => remove('Invoices', i)); toast('Order deleted'); location.hash = '#orders'; }
  }
});
$$('.nav a').forEach(a => a.addEventListener('click', () => { if (a.dataset.nav === 'new') draft = null; }));
window.addEventListener('online', () => scheduleSync(300));

/* ------------------------------------------------------------ start */
(async function start() {
  try { await loadAll(); }
  catch (e) { document.body.innerHTML = '<p style="padding:24px">Could not open storage: ' + esc(e.message) + '. Please open the app outside private/incognito mode.</p>'; return; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (S.url) S.sync.state = 'ok';
  updateChip();
  showLock();
})();
</script>
</body>
