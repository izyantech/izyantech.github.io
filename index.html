<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IZYAN TECH WORLD</title>
<meta name="description" content="QR digital shops, billing & inventory apps, websites, reels and automation for local businesses.">
<meta name="theme-color" content="#071426">
<link rel="canonical" href="https://izyantech.github.io/site/">
<link rel="icon" type="image/png" href="site/icons/favicon-64.png">

<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071426;color:#f7f9fd;font:16px/1.5 Inter,system-ui,sans-serif;text-align:center;padding:20px}a{color:#f1d27a;font-weight:800}</style>
<script>
(function () {
  // The website lives in /site/ and the Manager in /manager/, so each installs as its own app.
  var go = function () { location.replace('site/' + location.search + location.hash); };
  try {
    // Phones that opened the old site still have its offline helper on "/" — remove it first.
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) { return r.scope === location.origin + '/'; }).map(function (r) { return r.unregister(); }));
      }).then(go, go);
      setTimeout(go, 800);
      return;
    }
  } catch (e) {}
  go();
})();
</script>
</head>
<body>
<p>Opening IZYAN TECH WORLD… <a href="site/">Tap here if it does not open</a></p>
</body>
